<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deepedu.school</title>
<style>
:root{--primary:#2563eb;--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155;--green:#10b981;--amber:#f59e0b;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;gap:16px;min-height:52px}
header h1{font-size:20px;color:var(--primary);white-space:nowrap}

/* Tab navigation */
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:3px}
.tab{padding:7px 18px;border:none;border-radius:8px;font-size:13px;cursor:pointer;background:transparent;color:var(--text2);transition:all .2s;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{background:var(--primary);color:#fff}

/* Header right */
.header-right{display:flex;gap:8px;align-items:center}
.badge{background:#1e3a5f;color:#60a5fa;padding:3px 12px;border-radius:20px;font-size:11px;white-space:nowrap}
.badge.on{background:#065f46;color:#34d399}
.btn-tv{padding:6px 14px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}

/* Tab content */
.tab-content{flex:1;display:none;flex-direction:column;overflow:hidden}
.tab-content.active{display:flex}
.tab-content iframe{flex:1;border:none;width:100%;height:100%}

/* DeepTutor chat */
main{flex:1;display:flex;flex-direction:column;padding:0 24px;overflow:hidden}
.skills{display:flex;gap:8px;padding:14px 0;flex-wrap:wrap;flex-shrink:0}
.skill-tag{padding:6px 16px;border:2px solid var(--border);border-radius:24px;font-size:13px;cursor:pointer;background:var(--card);color:var(--text2);transition:all .2s}
.skill-tag.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.messages{flex:1;overflow-y:auto;padding:14px 0;font-size:15px;line-height:1.6}
.msg{margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.msg .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.msg.assistant .av{background:#1e3a5f;color:#60a5fa}
.msg.user .av{background:var(--primary);color:#fff}
.msg .bub{max-width:75%;padding:12px 16px;border-radius:12px}
.msg.assistant .bub{background:var(--card)}
.msg.user .bub{background:var(--primary)}
.msg .cost{font-size:10px;color:var(--text2);margin-top:4px}
.input-area{display:flex;gap:10px;padding:16px 0;border-top:1px solid var(--border);flex-shrink:0}
.input-area input{flex:1;padding:10px 16px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--card);color:var(--text);outline:none}
.input-area input:focus{border-color:var(--primary)}
.input-area button{padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600}

/* Tab placeholder */
.tab-placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2);font-size:14px}

@media(max-width:900px){
  header{padding:10px 16px;flex-wrap:wrap;gap:8px}
  header h1{font-size:16px}
  .tabs{order:3;width:100%;overflow-x:auto;justify-content:flex-start}
  .tab{padding:6px 14px;font-size:12px}
  .skills,.input-area{padding-left:16px;padding-right:16px}
  main{padding:0 16px}
}
</style>
</head>
<body>

<header>
  <h1>deepedu.school</h1>
  <nav class="tabs" id="tabNav">
    <button class="tab active" data-tab="deeptutor">DeepTutor</button>
    <button class="tab" data-tab="deepecho">Deepecho</button>
    <button class="tab" data-tab="deepedulab">Deepedulab</button>
    <button class="tab" data-tab="deepmarble">DeepMarble</button>
  </nav>
  <div class="header-right">
    <span class="badge on" id="dtBadge" style="display:none">DeepTutor</span>
    <span class="badge" id="statusBadge">就绪</span>
    <button class="btn-tv" onclick="location.href='/tv'">📺 返回TV大屏</button>
  </div>
</header>

<!-- DeepTutor Tab -->
<div class="tab-content active" id="tab-deeptutor">
  <main>
    <div class="skills" id="skillBar">
      <span class="skill-tag active" data-skill="math">数学辅导</span>
      <span class="skill-tag" data-skill="english">英语听说</span>
      <span class="skill-tag" data-skill="compose">作文批改</span>
      <span class="skill-tag" data-skill="quiz">自适应测评</span>
      <span class="skill-tag" data-skill="oral">口算</span>
      <span class="skill-tag" data-skill="chinese">语文</span>
    </div>
    <div class="messages" id="messages">
      <div class="msg assistant">
        <div class="av">DT</div>
        <div class="bub">
          <strong>DeepTutor</strong> — 家庭教育 AI 助手<br><br>
          点击上方 Tab 切换应用。试试输入：鸡兔同笼 · 三角函数 · 英语语法 · 作文点评
        </div>
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="chatInput" placeholder="输入题目，回车发送..." autofocus>
      <button onclick="send()">发送</button>
    </div>
  </main>
</div>

<!-- Deepecho Tab -->
<div class="tab-content" id="tab-deepecho">
  <div class="tab-placeholder" id="ph-deepecho">点击上方「Deepecho」加载应用</div>
</div>

<!-- Deepedulab Tab -->
<div class="tab-content" id="tab-deepedulab">
  <div class="tab-placeholder" id="ph-deepedulab">点击上方「Deepedulab」加载应用</div>
</div>

<!-- DeepMarble Tab -->
<div class="tab-content" id="tab-deepmarble">
  <div class="tab-placeholder" id="ph-deepmarble">点击上方「DeepMarble」加载应用</div>
</div>

<script>
const API='/api',DT_WS='wss://creative-upliftment-production-1ec0.up.railway.app/api/v1/ws',LOCAL_URL='http://localhost:8765/chat';
let skill='math',history=[],ws=null,csMsg=null,tokenUsed=0;
const TK={math:{c:3000,l:500},english:{c:2000,l:400},compose:{c:6000,l:0},quiz:{c:4000,l:1000},oral:{c:300,l:50},dictation:{c:400,l:100},chinese:{c:4000,l:500}};
const APP_URLS={
  deepecho:'https://echo-loop-pwa.vercel.app',
  deepedulab:'/api/edulab',
  deepmarble:'https://marble-taxonomy-explorer-cn.vercel.app'
};
let loadedTabs={};

// Tab switching
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>switchTab(t.dataset.tab));
});

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+name));
  if(name==='deeptutor'){
    document.getElementById('chatInput').focus();
    return;
  }
  if(loadedTabs[name])return;
  let url=APP_URLS[name];
  if(name==='deepedulab')url+='?skill=solid-geometry&type=random&seed='+Math.floor(Math.random()*10000);
  let container=document.getElementById('tab-'+name);
  container.innerHTML='<iframe src="'+url+'" allow="camera;microphone;fullscreen"></iframe>';
  loadedTabs[name]=true;
}

// DeepTutor core
function addTokens(n){tokenUsed+=n}

async function cDT(){
  if(ws&&ws.readyState===WebSocket.OPEN)return true;
  try{
    ws=new WebSocket(DT_WS);
    return new Promise(r=>{
      ws.onopen=()=>{document.getElementById('dtBadge').style.display='inline';r(true)};
      ws.onerror=()=>r(false);
      ws.onclose=()=>{document.getElementById('dtBadge').style.display='none';ws=null};
      setTimeout(()=>{if(ws.readyState!==WebSocket.OPEN)r(false)},3000)
    })
  }catch(e){return false}
}

async function sDT(m){
  let c=await cDT();
  if(!c)return false;
  let d=addStream();
  csMsg=d;
  return new Promise(r=>{
    let acc='',done=false,renew=()=>{clearTimeout(tid);tid=setTimeout(()=>{acc?r(true):(d.remove(),r(false))},12000)};
    let tid=setTimeout(()=>{d.remove();r(false)},15000);
    ws.onmessage=(e)=>{
      try{
        let data=JSON.parse(e.data);
        renew();
        if(data.type==='error'){clearTimeout(tid);done=true;csMsg.innerHTML='<span style="color:var(--red)">DeepTutor 出错：'+(data.content||'')+'</span>';r(true);return}
        if(data.type==='content'&&data.content){acc+=data.content;csMsg.innerHTML=acc.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\\n/g,'<br>');document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}
        if(data.type==='result'&&!done){clearTimeout(tid);done=true;let txt=data.metadata&&data.metadata.response?data.metadata.response:acc;if(txt){csMsg.innerHTML=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\\n/g,'<br>');document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}r(true)}
        if(data.type==='done'&&!done){clearTimeout(tid);done=true;r(true)}
      }catch(err){r(false)}
    };
    ws.send(JSON.stringify({type:'start_turn',content:m,session_id:'',capability:'chat',knowledge_bases:[],tools:['web_search','reason'],language:'zh'}))
  })
}

function addStream(){
  let c=document.getElementById('messages'),d=document.createElement('div');
  d.className='msg assistant';
  d.innerHTML='<div class="av">DT</div><div class="bub"></div>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
  return d.querySelector('.bub')
}

document.querySelectorAll('.skill-tag').forEach(t=>{t.addEventListener('click',()=>swSkill(t))});
function swSkill(e){document.querySelectorAll('.skill-tag').forEach(t=>t.classList.remove('active'));e.classList.add('active');skill=e.dataset.skill}
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});

async function send(){
  let i=document.getElementById('chatInput'),m=i.value.trim();
  if(!m)return;
  i.value='';
  addMsg('user',m);
  let c=TK[skill]||{c:2000,l:300};
  try{
    let r=await fetch(LOCAL_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:m}],temperature:0.3,max_tokens:1024})});
    if(r.ok){let d=await r.json();addMsg('assistant',d.answer,c.l);addTokens(c.l);return}
  }catch(e){}
  if(skill==='math'){
    let s=await sDT(m);
    if(s){addTokens(c.c);return}
  }
  try{
    let r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,skill_type:skill,history:history.slice(-10)})});
    let d=await r.json();
    addMsg('assistant',d.answer,c.c);
    addTokens(c.c)
  }catch(e){addMsg('assistant','所有引擎不可用。',0)}
}

function addMsg(r,t,tk){
  let c=document.getElementById('messages'),d=document.createElement('div');
  d.className='msg '+r;
  let h='<div class="av">'+(r==='assistant'?'DT':'你')+'</div><div class="bub">'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^## (.+)/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  if(tk>0&&r==='assistant')h+='<div class="cost">'+tk.toLocaleString()+' Token</div>';
  h+='</div>';d.innerHTML=h;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

cDT();
</script>
</body>
</html>
