<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deepedu.school</title>
<style>
:root{--primary:#2563eb;--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;gap:16px;min-height:52px}
header h1{font-size:20px;color:var(--primary);white-space:nowrap}

.tabs{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:3px}
.tab{padding:7px 18px;border:none;border-radius:8px;font-size:13px;cursor:pointer;background:transparent;color:var(--text2);transition:all .2s;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{background:var(--primary);color:#fff}

.header-right{display:flex;gap:8px;align-items:center}
.btn-tv{padding:6px 14px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}

.tab-content{flex:1;display:none}
.tab-content.active{display:flex}
.tab-content iframe{flex:1;border:none;width:100%;height:100%}

@media(max-width:900px){
  header{padding:10px 16px;flex-wrap:wrap;gap:8px}
  header h1{font-size:16px}
  .tabs{order:3;width:100%;overflow-x:auto}
  .tab{padding:6px 14px;font-size:12px}
}
</style>
</head>
<body>

<header>
  <h1>deepedu.school</h1>
  <nav class="tabs" id="tabNav">
    <button class="tab active" data-tab="deeptutor">DeepTutor</button>
    <button class="tab" data-tab="deepecho">Deepecho</button>
    <button class="tab" data-tab="deepedulab">Deepedulab</button>
    <button class="tab" data-tab="deepmarble">DeepMarble</button>
  </nav>
  <div class="header-right">
    <button class="btn-tv" onclick="location.href='/tv'">📺 返回TV大屏</button>
  </div>
</header>

<div class="tab-content active" id="tab-deeptutor">
  <iframe src="https://creative-upliftment-production-1ec0.up.railway.app/home" allow="camera;microphone;fullscreen"></iframe>
</div>

<div class="tab-content" id="tab-deepecho"></div>
<div class="tab-content" id="tab-deepedulab"></div>
<div class="tab-content" id="tab-deepmarble"></div>

<script>
const APP_URLS={
  deepecho:'https://echo-loop-pwa.vercel.app',
  deepedulab:'/api/edulab',
  deepmarble:'https://marble-taxonomy-explorer-cn.vercel.app'
};
let loadedTabs={deeptutor:true};

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>switchTab(t.dataset.tab));
});

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+name));
  if(loadedTabs[name])return;
  let url=APP_URLS[name];
  if(name==='deepedulab')url+='?skill=solid-geometry&type=random&seed='+Math.floor(Math.random()*10000);
  document.getElementById('tab-'+name).innerHTML='<iframe src="'+url+'" allow="camera;microphone;fullscreen"></iframe>';
  loadedTabs[name]=true;
}
</script>
</body>
</html>
